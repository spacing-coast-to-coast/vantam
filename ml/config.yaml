dataset:
  dn_thr: -0.01
  end: null
  exchange: binanceus
  horizon_min: 4
  mode: full
  out_parquet: "/work/analysis/ml/data/dataset.parquet"
  resample_to: 15T
  start: '2014-01-01'
  symbols:
  - BTC/USDT
  - ETH/USDT
  - ADA/USDT
  - XRP/USDT
  up_thr: 0.01

model:
  name: lightgbm
  test_days: 365
  class_weights: true      # used for logreg/rf only unless you explicitly pass class_weight
  random_state: 42
  options:
    logreg:
      C: 0.5
      penalty: "l2"
      solver: "lbfgs"
      max_iter: 2000

    rf:
      n_estimators: 400
      max_depth: 10
      min_samples_leaf: 5
      n_jobs: -1

    xgboost:
      n_estimators: 500
      max_depth: 7
      learning_rate: 0.05
      subsample: 0.9
      colsample_bytree: 0.9
      reg_lambda: 1.0
      tree_method: "hist"
      eval_metric: "mlogloss"

    lightgbm:
      objective: multiclass
      num_class: 3          # because labels are {-1,0,1} (we encode to 0..2)
      n_estimators: 600
      num_leaves: 64
      max_depth: -1
      learning_rate: 0.05
      subsample: 0.9        # alias: bagging_fraction
      colsample_bytree: 0.9 # alias: feature_fraction
      reg_lambda: 1.0
